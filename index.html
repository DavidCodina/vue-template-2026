<!doctype html>
<!-- 
In a Vite + Vue 3 project, index.html isn't just a static file.
Vite treats it as part of the build, which is why we can still use Tailwind here.
-->
<html class="h-full max-h-full" lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
  </head>
  <body class="h-full max-h-full">
    <!-- Using Tailwind's h-full here only works if <html> and <body> also have h-full. -->
    <div id="app" class="flex flex-col h-full overflow-y-scroll"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
